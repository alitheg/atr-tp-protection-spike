name: claims
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims (payload only)
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=atr-spike" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq -c '{ref, ref_type, ref_protected, sha, workflow_sha, job_workflow_sha, event_name}'
